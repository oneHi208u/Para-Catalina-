<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalina 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: linear-gradient(to bottom, #000000, #1a001a);
    color: white;
    font-family: 'Poppins', sans-serif;
    text-align: center;
    overflow-x: hidden;
}

/* Corazones flotando */
.heart {
    position: fixed;
    bottom: -10px;
    color: #ff4da6;
    animation: floatUp linear infinite;
    font-size: 20px;
    opacity: 0.8;
}

@keyframes floatUp {
    from {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    to {
        transform: translateY(-110vh) scale(1.5);
        opacity: 0;
    }
}

.cinema {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 3em;
    animation: fadeIn 3s ease-in-out;
}

p {
    font-size: 1.2em;
    max-width: 600px;
    margin: 20px auto;
    animation: fadeIn 5s ease-in-out;
}

button {
    padding: 12px 25px;
    background-color: #ff4da6;
    border: none;
    border-radius: 25px;
    color: white;
    font-size: 1em;
    cursor: pointer;
    transition: 0.3s;
    animation: fadeIn 6s ease-in-out;
}

button:hover {
    background-color: #ff1a8c;
    transform: scale(1.1);
}

.gallery {
    margin-top: 50px;
    animation: fadeUp 3s ease-in-out;
}

img {
    width: 250px;
    margin: 10px;
    border-radius: 15px;
    transition: 0.5s;
}

img:hover {
    transform: scale(1.1);
}

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}

@keyframes fadeUp {
    from {opacity: 0; transform: translateY(40px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<!-- Música automática (reemplazar VIDEO_ID) -->
<iframe width="0" height="0" 
src="https://www.youtube.com/embed/ubq19HWOYo4?autoplay=1&loop=1&playlist=VIDEO_ID" 
frameborder="0" allow="autoplay">
</iframe>

<div class="cinema">
    <h1>Para Catalina 💖</h1>
    <p>
        Como en las películas que nos hacen creer en el amor eterno,
        apareciste en mi vida y cambiaste cada escena.
        Desde ese momento, supe que mi historia favorita
        sería la que escribo con vos.
    </p>
    <button onclick="mostrarGaleria()">Nuestra Historia ✨</button>
</div>

<div class="gallery" id="galeria" style="display:none;">
    <h2>Momentos que guardo en el corazón</h2>
    <img src="foto1.jpg">
    <img src="foto2.jpg">
    <img src="foto3.jpg">
</div>

<script>
// Mostrar galería
function mostrarGaleria() {
    document.getElementById("galeria").style.display = "block";
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

// Crear corazones automáticamente
function crearCorazon() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    heart.style.fontSize = (Math.random() * 20 + 15) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(crearCorazon, 300);
</script>

</body>
</html>
