<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalina 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: linear-gradient(to bottom, #000000, #1a001a);
    color: white;
    font-family: 'Poppins', sans-serif;
    text-align: center;
    overflow-x: hidden;
}

/* Corazones */
.heart {
    position: fixed;
    bottom: -10px;
    color: #ff4da6;
    animation: floatUp linear infinite;
    opacity: 0.8;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-110vh); opacity: 0; }
}

.cinema {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: 3em;
    animation: fadeIn 3s ease-in-out;
}

p {
    font-size: 1.2em;
    max-width: 600px;
    margin: 20px auto;
    animation: fadeIn 5s ease-in-out;
}

button {
    padding: 14px 30px;
    background-color: #ff4da6;
    border: none;
    border-radius: 30px;
    color: white;
    font-size: 1em;
    cursor: pointer;
    transition: 0.3s;
    animation: fadeIn 6s ease-in-out;
}

button:hover {
    background-color: #ff1a8c;
    transform: scale(1.1);
}

.gallery {
    margin-top: 50px;
    display: none;
    animation: fadeUp 2s ease-in-out;
}

img {
    width: 250px;
    margin: 10px;
    border-radius: 15px;
    transition: 0.5s;
}

img:hover {
    transform: scale(1.1);
}

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}

@keyframes fadeUp {
    from {opacity: 0; transform: translateY(40px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<!-- Música (oculta) -->
<iframe id="musica"
width="0"
height="0"
src=""
frameborder="0"
allow="autoplay">
</iframe>

<div class="cinema">
    <h1>Para Catalina 💖</h1>
    <p>
        Como en las películas que nos hacen creer en el amor eterno,
        apareciste en mi vida y cambiaste cada escena.
        Desde ese momento, supe que mi historia favorita
        sería la que escribo con vos.
    </p>
    <button onclick="iniciarSorpresa()">Nuestra Historia ✨</button>
</div>

<div class="gallery" id="galeria">
    <h2>Momentos que guardo en el corazón</h2>
    <img src="IMG-20250423-WA0011.jpg">
    <img src="IMG-20250421-WA0008.jpg">
    <img src="IMG-20250406-WA0072.jpg">
    <img src="IMG-20251019-WA0053.jpg">
    <img src="IMG-20251019-WA0006.jpg">
    <img src="IMG-20250802-WA0008.jpg">
    <img src="IMG-20250719-WA0030.jpg">
    <img src="IMG-20250713-WA0069.jpg">
</div>

<script>

// ⚠️ PONÉ ACÁ EL ID DEL VIDEO
const videoID = "ubq19HWOYo4";

function iniciarSorpresa() {

    // Mostrar galería
    document.getElementById("galeria").style.display = "block";

    // Reproducir música
    const iframe = document.getElementById("musica");
    iframe.src = "https://www.youtube.com/embed/" + videoID + "?autoplay=1&loop=1&playlist=" + videoID;

    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

// Corazones flotando
function crearCorazon() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    heart.style.fontSize = (Math.random() * 20 + 15) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(crearCorazon, 300);

</script>

</body>
</html>
