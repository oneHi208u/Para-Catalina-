<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalina 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: linear-gradient(to bottom, #000000, #1a001a);
    color: white;
    font-family: 'Poppins', sans-serif;
    text-align: center;
    overflow-x: hidden;
}

/* ⭐ Estrellas */
.star {
    position: fixed;
    width: 2px;
    height: 2px;
    background: white;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
}
@keyframes twinkle {
    from {opacity: 0.2;}
    to {opacity: 1;}
}

/* 💖 Corazones */
.heart {
    position: fixed;
    bottom: -10px;
    color: #ff4da6;
    animation: floatUp linear infinite;
    opacity: 0.8;
}
@keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-110vh); opacity: 0; }
}

/* 🌷 Tulipanes */
.tulipan {
    position: fixed;
    top: -20px;
    font-size: 24px;
    animation: caerTulipan linear forwards;
}
@keyframes caerTulipan {
    from { transform: translateY(0) rotate(0deg); opacity:1; }
    to { transform: translateY(110vh) rotate(360deg); opacity:0; }
}

.cinema {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

button {
    padding: 14px 30px;
    background-color: #ff4da6;
    border: none;
    border-radius: 30px;
    color: white;
    font-size: 1em;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    background-color: #ff1a8c;
    transform: scale(1.1);
}

.gallery {
    margin-top: 50px;
    display: none;
}

img {
    width: 250px;
    margin: 10px;
    border-radius: 15px;
    transition: 0.5s;
}
img:hover {
    transform: scale(1.1);
}

/* 🎬 Overlay */
.overlay {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: radial-gradient(circle, rgba(255,0,128,0.15), rgba(0,0,0,0.95));
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    opacity:0;
    pointer-events:none;
    transition:1.5s;
    animation: fondoLatido 3s infinite;
}

/* 💓 Fondo late */
@keyframes fondoLatido {
    0% { background: radial-gradient(circle, rgba(255,0,128,0.10), rgba(0,0,0,0.95)); }
    50% { background: radial-gradient(circle, rgba(255,0,128,0.25), rgba(0,0,0,0.95)); }
    100% { background: radial-gradient(circle, rgba(255,0,128,0.10), rgba(0,0,0,0.95)); }
}

/* 💖 Título */
.overlay h2 {
    font-size:3em;
    color:#ff4da6;
    margin-bottom:20px;
    text-shadow:0 0 20px #ff4da6;
    animation: latidoReal 1.5s infinite;
    position: relative;
}

/* 💓 Latido */
@keyframes latidoReal {
    0% { transform: scale(1); text-shadow: 0 0 15px #ff4da6; }
    25% { transform: scale(1.08); text-shadow: 0 0 40px #ff1a8c; }
    40% { transform: scale(1); }
    60% { transform: scale(1.05); text-shadow: 0 0 30px #ff66cc; }
    100% { transform: scale(1); text-shadow: 0 0 15px #ff4da6; }
}

/* 🌟 Destello constante */
.overlay h2::after {
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    width:5px;
    height:5px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 20px white, 0 0 40px #ff4da6;
    animation: destello 3s infinite;
}
@keyframes destello {
    0% { opacity:0; transform:translate(-50%,-50%) scale(0); }
    50% { opacity:1; transform:translate(-50%,-50%) scale(2); }
    100% { opacity:0; transform:translate(-50%,-50%) scale(0); }
}

/* ✨ Explosión épica */
.epico {
    animation: explosionBrillo 1.2s ease;
}
@keyframes explosionBrillo {
    0% { transform: scale(1); }
    40% { transform: scale(1.15); text-shadow: 0 0 60px #ffffff, 0 0 100px #ff4da6; }
    100% { transform: scale(1); }
}

.carta {
    max-width:600px;
    font-size:1.2em;
    white-space:pre-wrap;
    margin-bottom:20px;
}

.oculto {
    font-size:1.4em;
    color:#ff99cc;
    margin-top:20px;
    text-shadow:0 0 15px #ff4da6;
}
</style>
</head>

<body>

<iframe id="musica" width="0" height="0" src="" frameborder="0" allow="autoplay"></iframe>

<!-- 🔔 Campana -->
<audio id="campana" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_6c2b4b0b8b.mp3?filename=magic-bell-6214.mp3"></audio>

<div class="cinema">
    <h1>Para Catalina 💖</h1>
    <p>
        Como en las películas que nos hacen creer en el amor eterno,
        apareciste en mi vida y cambiaste cada escena.
    </p>
    <button onclick="iniciarSorpresa()">Nuestra Historia ✨</button>
</div>

<div class="gallery" id="galeria">
    <h2>Momentos que guardo en el corazón</h2>
    <img src="IMG-20250423-WA0011.jpg">
    <img src="IMG-20250421-WA0008.jpg">
    <img src="IMG-20250406-WA0072.jpg">
    <img src="IMG-20251019-WA0053.jpg">
    <img src="IMG-20251019-WA0006.jpg">
    <img src="IMG-20250802-WA0008.jpg">
    <img src="IMG-20250719-WA0030.jpg">
    <img src="IMG-20250713-WA0069.jpg">
</div>

<div class="overlay" id="final">
    <h2>TE AMO CATALINA SALMAN CIPPITELLI MI CENICIENTA 💘❤️♾️💖</h2>
    <div class="carta" id="carta"></div>
    <div class="oculto" id="mensajeFinal"></div>
</div>

<script>

const videoID = "ubq19HWOYo4";

function iniciarSorpresa() {
    document.getElementById("galeria").style.display = "block";
    const iframe = document.getElementById("musica");
    iframe.src = "https://www.youtube.com/embed/" + videoID + "?autoplay=1&loop=1&playlist=" + videoID;
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    setTimeout(mostrarFinal, 8000);
}

function mostrarFinal(){
    const overlay = document.getElementById("final");
    overlay.style.opacity = "1";
    overlay.style.pointerEvents = "all";
    escribirCarta();
    iniciarTulipanes();
}

function escribirCarta(){
    const texto = "Desde que llegaste a mi vida, todo tiene más color.\n\nSos mi casualidad favorita, mi mejor historia, mi mejor destino.\n\nSi esto fuera una película, elegiría mil veces volver a conocerte.\n\nY si la vida es una historia...\nQuiero que la mía siempre sea con vos.\n\n";
    let i = 0;
    function escribir(){
        if(i < texto.length){
            document.getElementById("carta").innerHTML += texto.charAt(i);
            i++;
            setTimeout(escribir, 50);
        } else {
            setTimeout(escribirPromesa, 1000);
        }
    }
    escribir();
}

function escribirPromesa(){
    const promesa = "Te hago la promesa de que siempre estaremos juntos y ahora dame tu mano 💍";
    let j = 0;
    function escribir2(){
        if(j < promesa.length){
            document.getElementById("mensajeFinal").innerHTML += promesa.charAt(j);
            j++;
            setTimeout(escribir2, 60);
        } else {
            momentoEpico();
        }
    }
    escribir2();
}

function momentoEpico(){
    document.getElementById("campana").play();
    const titulo = document.querySelector(".overlay h2");
    titulo.classList.add("epico");
    setTimeout(() => titulo.classList.remove("epico"), 1200);
}

/* Corazones */
function crearCorazon() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    heart.style.fontSize = (Math.random() * 20 + 15) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}
setInterval(crearCorazon, 300);

/* Tulipanes */
function iniciarTulipanes(){
    setInterval(()=>{
        const tulipan=document.createElement("div");
        tulipan.classList.add("tulipan");
        tulipan.innerHTML="🌷";
        tulipan.style.left=Math.random()*100+"vw";
        tulipan.style.animationDuration=(Math.random()*3+4)+"s";
        document.body.appendChild(tulipan);
        setTimeout(()=> tulipan.remove(),7000);
    },500);
}

/* Estrellas */
for(let i=0;i<80;i++){
    const star=document.createElement("div");
    star.classList.add("star");
    star.style.top=Math.random()*100+"vh";
    star.style.left=Math.random()*100+"vw";
    star.style.animationDuration=(Math.random()*2+1)+"s";
    document.body.appendChild(star);
}

</script>
</body>
</html>
